name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('DnsManager.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "Syntax OK"
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser -AllowClobber
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Console UI uses Write-Host intentionally (48x); exclude PSAvoidUsingWriteHost.
          $res = Invoke-ScriptAnalyzer -Path DnsManager.ps1 -Severity Error, Warning -ExcludeRule 'PSAvoidUsingWriteHost'
          if ($res) { $res | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "Analyzer clean"
      - name: Verify version consistency
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { Write-Host "version.txt invalid: $ver"; exit 1 }
          $src = Get-Content DnsManager.ps1 -Raw
          if ($src -notmatch [regex]::Escape($ver)) { Write-Host "DnsManager.ps1 does not contain version $ver"; exit 1 }
          Write-Host "Version OK: $ver"
