name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $fileVer = (Get-Content version.txt -Raw).Trim()
          if ($fileVer -ne $version) { Write-Host "::warning::tag $tag != version.txt $fileVer (using tag)" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item DnsManager.ps1, README.md, LICENSE, version.txt -Destination stage/
          if (Test-Path servers.ini) { Copy-Item servers.ini -Destination stage/ }
          Compress-Archive -Path stage/* -DestinationPath "DnsManager-v$version.zip" -Force
          Get-ChildItem "DnsManager-v$version.zip"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DnsManager-v*.zip
          generate_release_notes: true
